<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LED方向幕シミュレーター</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=M+PLUS+1:wght@500;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">

    <!-- GoatCounter -->
    <script
        data-goatcounter="https://mikan-1738.goatcounter.com/count"
        async
        src="//gc.zgo.at/count.js">
    </script>
</head>

<body>

    <!-- Loading -->
    <div id="loading" hidden>
        <span>Loading</span>
        <span class="loadingDots"></span>
    </div>


    <!-- Title -->
    <header id="tittle">
        <h1>LED方向幕シミュレーター</h1>
    </header>


    <!-- Visitor Counter -->
    <div id="visitorCounter">
        累計訪問者数：
        <span id="visitorCount">---</span>
    </div>


    <!-- Vehicle Selector -->
    <div id="vehicleSelector">

        <label id="vehicle">
            車両を選択
        </label>

        <div
            id="vehicleSelect"
            class="selectGroup">
        </div>

    </div>


    <!-- Simulator -->
    <div id="simulator" hidden>

        <div class="container">

            <!-- Sidebar -->
            <aside id="sidebar">

                <div id="setTime">
                    ...
                </div>

                <div id="buttonGroup">
                    ...
                </div>

                <div id="scroll" hidden>
                    ...
                </div>


                <!-- Vehicle Explanation -->
                <div id="explanation">

                    <h2>
                        車両説明
                    </h2>

                    <div id="explanationLabel"></div>

                </div>


                <!-- Reference Site -->
                <div id="referenceSite" hidden>
                    ...
                </div>


                <!-- Back to Vehicle Selection -->
                <button id="vehicleSelectButton">
                    車両選択に戻る
                </button>

            </aside>


            <!-- Resizer -->
            <div id="resizer"></div>


            <!-- LED Display -->
            <main>

                <div class="ledFrame">

                    <canvas
                        id="led"
                        width="895"
                        height="223">
                    </canvas>

                </div>

            </main>

        </div>

    </div>


    <!-- Status -->
    <footer id="status"></footer>


    <!-- Mobile JS Error Display -->
    <div
        id="errorDisplay"
        hidden
        style="
            position: fixed;
            left: 10px;
            right: 10px;
            bottom: 10px;
            z-index: 99999;
            padding: 12px;
            background: #222;
            color: #fff;
            border-radius: 8px;
            font-size: 13px;
            white-space: pre-wrap;
            word-break: break-word;
        "
    >

        <strong>JavaScript Error</strong>

        <div id="errorDisplayText"></div>

    </div>


    <!-- Error Detection -->
    <script>

        (function () {

            const box =
                document.getElementById("errorDisplay");

            const text =
                document.getElementById("errorDisplayText");


            function showError(message) {

                box.hidden = false;
                text.textContent = message;

            }


            window.addEventListener(
                "error",
                function (event) {

                    showError(
                        event.message +
                        "\n" +
                        event.filename +
                        ":" +
                        event.lineno +
                        ":" +
                        event.colno
                    );

                }
            );


            window.addEventListener(
                "unhandledrejection",
                function (event) {

                    showError(
                        String(event.reason)
                    );

                }
            );

        })();

    </script>


    <!-- GoatCounter Visitor Count -->
    <script>

        var visitorCounterTimer =
            setInterval(function () {

                if (
                    window.goatcounter &&
                    window.goatcounter.visit_count
                ) {

                    clearInterval(
                        visitorCounterTimer
                    );

                    window.goatcounter.visit_count({

                        path: "TOTAL",

                        append: "#visitorCount"

                    });

                }

            }, 100);

    </script>


    <!-- Simulator JavaScript -->
    <script src="js/state.js"></script>
    <script src="js/constants.js"></script>
    <script src="js/dom.js"></script>
    <script src="js/json.js"></script>
    <script src="js/buttons.js"></script>
    <script src="js/display.js?v=3"></script>
    <script src="js/render.js"></script>
    <script src="js/vehicle.js"></script>
    <script src="js/script.js"></script>

</body>
</html>
