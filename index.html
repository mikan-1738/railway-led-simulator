<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">

  <title>Railway LED Simulator</title>

  <style>
    :root {
      color-scheme: light;

      --bg: #ffffff;
      --panel: #f5f5f5;
      --line: #cccccc;
      --text: #222222;
      --sub: #666666;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    header {
      padding: 18px 20px;
      border-bottom: 1px solid var(--line);
      background: #ffffff;
    }

    header h1 {
      margin: 0;
      font-size: 20px;
      cursor: pointer;
      user-select: none;
    }

    header h1:hover {
      opacity: 0.65;
    }

    header p {
      margin: 4px 0 0;
      color: var(--sub);
      font-size: 13px;
    }

    main {
      width: min(1200px, 100%);
      margin: auto;
      padding: 16px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 14px;
    }

    .panel h2 {
      margin: 0 0 12px;
      font-size: 16px;
    }

    .button-grid {
      display: grid;
      grid-template-columns:
        repeat(auto-fill, minmax(120px, 1fr));
      gap: 8px;
    }

    button {
      appearance: none;
      border: 1px solid #000000;
      border-radius: 8px;
      padding: 10px 12px;

      background: #000000;
      color: #ffffff;

      font: inherit;
      cursor: pointer;

      transition:
        background 0.12s ease,
        border-color 0.12s ease;
    }

      background: #333333;
